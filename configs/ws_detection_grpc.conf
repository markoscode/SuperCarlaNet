# WS-Mask2Former detection via gRPC
# Use this config when running detection in a separate container
#
# Prerequisites:
#   1. Start the detection server: docker compose up -d wsobjdet
#   2. Run Pylot with: python pylot.py --flagfile=configs/ws_detection_grpc.conf

--obstacle_detection
--nosimulator_obstacle_detection
--obstacle_detection_model_paths=ws_maskformer_grpc
--obstacle_detection_model_names=ws_maskformer_grpc

# gRPC server address (container name on docker network)
--ws_maskformer_grpc_address=wsobjdet:50051

# Subnet selection (applied on server)
--ws_maskformer_subnet=max

# Detection thresholds
--obstacle_detection_min_score_threshold=0.3
--ws_maskformer_min_mask_area=200

###### Control config #####
--control=simulator_auto_pilot

######### Carla config #########
--simulator_num_people=250
--simulator_num_vehicles=20

######### Logging config #########
--log_file_name=pylot_wsdet_grpc.log
--csv_log_file_name=pylot_wsdet_grpc.csv
--v=1

######### Visualization (optional) #########
#--visualize_rgb_camera
#--visualize_detected_obstacles
